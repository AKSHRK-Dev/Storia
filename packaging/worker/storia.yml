# Storia Worker settings (see README.md in this folder)
# A worker runs part of a shared world for a Storia Cluster. It keeps no world of its own:
# the Storia Relay stores the world and hands parts of it to the workers.
ram-world:
  enabled: false
cluster:
  enabled: true
  # The Storia Relay that coordinates the cluster.
  coordinator: "relay-host:25590"
  # A unique name for this worker. Use the same name for it in the proxy's velocity.toml.
  node-name: "worker-1"
  # The same secret as the relay (and the proxy's [cluster] section), at least 8 characters.
  secret: ""
