# Stolia Worker settings (see README.md in this folder)
ram-world:
  enabled: false
player-budget:
  enabled: false
offload:
  mode: worker
  # The same secret as your Stolia server (and relay), at least 8 characters.
  secret: ""
  # Listen for Stolia servers on this port...
  bind: 0.0.0.0
  port: 25590
  # ...or connect out to a Stolia Relay instead, e.g. "relay.example.lan:25590".
  relay: ""
  # Compute threads; -1 = all CPU cores.
  threads: -1
  compress: true
