name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release: v<Minecraft version>, e.g. v26.2, then v26.2-2, v26.2-3 for later builds of the same version"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout Storia
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checkout Storia Proxy
        uses: actions/checkout@v5
        with:
          repository: AKSHRK-Dev/StoriaProxy
          ref: storia
          path: storia-proxy-src
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            25
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"
          git config --global gc.auto 0

      - name: Build Storia server
        run: |
          ./gradlew applyAllPatches --stacktrace
          ./gradlew createPaperclipJar --stacktrace
      - name: Build Storia Relay
        run: ./gradlew -p storia-relay jar -PrelayVersion="${TAG#v}"
      - name: Build Storia API (for plugins)
        run: ./gradlew -p storia-api jar sourcesJar javadocJar -PapiVersion="${TAG#v}"
      - name: Build Storia Proxy
        working-directory: storia-proxy-src
        run: ./gradlew :velocity-proxy:shadowJar

      - name: Package
        run: |
          V="${TAG#v}"
          mkdir -p dist
          cp folia-server/build/libs/folia-paperclip-*.jar "dist/storia-$V.jar"

          mkdir -p "pkg/storia-worker-$V"
          cp "dist/storia-$V.jar" "pkg/storia-worker-$V/storia.jar"
          cp packaging/worker/* "pkg/storia-worker-$V/"
          (cd pkg && zip -qr "../dist/storia-worker-$V.zip" "storia-worker-$V")

          mkdir -p "pkg/storia-relay-$V"
          cp "storia-relay/build/libs/storia-relay-$V.jar" "pkg/storia-relay-$V/storia-relay.jar"
          cp packaging/relay/* "pkg/storia-relay-$V/"
          (cd pkg && zip -qr "../dist/storia-relay-$V.zip" "storia-relay-$V")

          cp storia-proxy-src/proxy/build/libs/storia-proxy-*.jar "dist/storia-proxy-$V.jar"
          cp storia-api/build/libs/storia-api-$V.jar storia-api/build/libs/storia-api-$V-sources.jar storia-api/build/libs/storia-api-$V-javadoc.jar dist/
          ls -la dist

      - name: Write release notes
        run: |
          V="${TAG#v}"
          MC=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)
          cat > notes.md <<NOTES
          Storia $V: Minecraft $MC, Java 25.
          $(case "$V" in *beta*) printf '\n**Beta:** new features that are still being tested. Back up your server before trying it.\n' ;; esac)

          | File | What it is |
          | --- | --- |
          | \`storia-$V.jar\` | The Storia server (Folia fork). Run \`java -jar storia-$V.jar nogui\`. |
          | \`storia-worker-$V.zip\` | Storia Worker: one server of a Storia Cluster; add workers to run one world on several machines. See README.md inside. |
          | \`storia-relay-$V.zip\` | Storia Relay: the cluster's coordinator; stores the world and decides which worker runs which part (Java 21+). |
          | \`storia-proxy-$V.jar\` | Storia Proxy: Velocity fork with 50 built-in placeholders ([docs](https://github.com/AKSHRK-Dev/StoriaProxy)). |
          | \`storia-api-$V.jar\` | For plugin developers: data and messages shared by every worker (compileOnly; [docs](https://storiamc.com/en-us/docs/plugin-api/)). |

          All cluster traffic is encrypted and authenticated with your shared secret. Guide: https://storiamc.com/en-us/docs/cluster/
          NOTES
          sed -i 's/^          //' notes.md
          # what is new in this release, if written down
          if [ -f "release-notes/$V.md" ]; then printf '\n' >> notes.md; cat "release-notes/$V.md" >> notes.md; fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            PRE=""
            case "$TAG" in *alpha*|*beta*|*rc*) PRE="--prerelease" ;; esac
            gh release create "$TAG" dist/* --title "Storia ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA" $PRE
          fi
