name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0); it is created if it does not exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout Stolia
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checkout Stolia Proxy
        uses: actions/checkout@v5
        with:
          repository: AKSHRK-Dev/StoliaProxy
          ref: stolia
          path: stolia-proxy-src
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            25
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"
          git config --global gc.auto 0

      - name: Build Stolia server
        run: |
          ./gradlew applyAllPatches --stacktrace
          ./gradlew createPaperclipJar --stacktrace
      - name: Build Stolia Relay
        run: ./gradlew -p stolia-relay jar -PrelayVersion="${TAG#v}"
      - name: Build Stolia Proxy
        working-directory: stolia-proxy-src
        run: ./gradlew :velocity-proxy:shadowJar

      - name: Package
        run: |
          V="${TAG#v}"
          mkdir -p dist
          cp folia-server/build/libs/folia-paperclip-*.jar "dist/stolia-$V.jar"

          mkdir -p "pkg/stolia-worker-$V"
          cp "dist/stolia-$V.jar" "pkg/stolia-worker-$V/stolia.jar"
          cp packaging/worker/* "pkg/stolia-worker-$V/"
          (cd pkg && zip -qr "../dist/stolia-worker-$V.zip" "stolia-worker-$V")

          mkdir -p "pkg/stolia-relay-$V"
          cp "stolia-relay/build/libs/stolia-relay-$V.jar" "pkg/stolia-relay-$V/stolia-relay.jar"
          cp packaging/relay/* "pkg/stolia-relay-$V/"
          (cd pkg && zip -qr "../dist/stolia-relay-$V.zip" "stolia-relay-$V")

          cp stolia-proxy-src/proxy/build/libs/stolia-proxy-*.jar "dist/stolia-proxy-$V.jar"
          ls -la dist

      - name: Write release notes
        run: |
          V="${TAG#v}"
          MC=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)
          cat > notes.md <<NOTES
          Stolia $V for Minecraft $MC (Java 25).

          | File | What it is |
          | --- | --- |
          | \`stolia-$V.jar\` | The Stolia server (Folia fork). Run \`java -jar stolia-$V.jar nogui\`. |
          | \`stolia-worker-$V.zip\` | Stolia Worker: generates terrain for your server on another machine. See README.md inside. |
          | \`stolia-relay-$V.zip\` | Stolia Relay: hands terrain work to any number of workers (Java 21+, no Minecraft files). |
          | \`stolia-proxy-$V.jar\` | Stolia Proxy: Velocity fork with 50 built-in placeholders ([docs](https://github.com/AKSHRK-Dev/StoliaProxy)). |

          All offload traffic is encrypted and authenticated with your shared secret.
          NOTES
          sed -i 's/^          //' notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Stolia ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA"
          fi
